name: Publish review
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare website
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          base = "https://investment-music-review-2026-hsinen.cindy8906115.chatgpt.site/"
          paths = ["index.html", "market-charge.mp3"] + ["assets/asset-%d.%s" % (i, "svg" if i in (2,7) else "png") for i in range(1,10)]
          for name in paths:
              target = Path("public") / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(urlopen(base + ("" if name == "index.html" else name)).read())
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
